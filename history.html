<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تاریخچه سبد | بورس‌کالک</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ── Header ── -->
  <header class="header">
    <div class="header-brand">
      <h1>📈 بورس‌کالک</h1>
      <span class="tagline">تاریخچه و نمودار</span>
    </div>
    <div class="header-controls">
      <a href="index.html" class="btn btn-secondary">← بازگشت به سبد</a>
    </div>
  </header>

  <!-- ── Body ── -->
  <div class="hist-body">

    <!-- Controls bar -->
    <div class="hist-controls-bar">
      <div class="hist-account-wrap">
        <label for="histAccountSelect">حساب:</label>
        <select id="histAccountSelect" onchange="onAccountChange(this.value)">
          <option value="">انتخاب حساب...</option>
        </select>
      </div>
      <span id="histSnapshotCount" class="hist-count-badge"></span>
    </div>

    <!-- Empty state -->
    <div id="histEmpty" class="hist-empty" style="display:none">
      <div class="hist-empty-icon">📊</div>
      <h3>هنوز وضعیتی ذخیره نشده</h3>
      <p>از صفحه اصلی، دکمه «📸 ثبت وضعیت امروز» را روی نمای کلی سبد بزنید</p>
    </div>

    <!-- Charts -->
    <div id="histCharts" style="display:none">
      <div class="chart-card">
        <div class="chart-title">📊 نمودار سبد <span class="chart-unit">دارایی · سود تحقق‌یافته · سود/زیان لحظه‌ای · تغییر روزانه</span></div>
        <div id="histChart"></div>
      </div>
    </div>

    <!-- Table -->
    <div id="histTableSection" style="display:none">
      <div class="hist-table-section-header">
        <h3>🗓 سابقه وضعیت‌های ذخیره‌شده</h3>
        <span class="hist-table-hint">جدیدترین ردیف در بالا</span>
      </div>
      <div class="hist-table-wrap">
        <table class="hist-table" id="histTable"></table>
      </div>
    </div>

  </div><!-- /.hist-body -->
</div><!-- /#app -->

<!-- Modal -->
<div id="modalOverlay" class="modal-overlay" style="display:none"
     onclick="if(event.target===this)hideModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="modalTitle"></h3>
    <p id="modalMessage"></p>
    <div class="modal-footer" id="modalFooter">
      <button class="btn btn-ghost" onclick="hideModal()">بستن</button>
    </div>
  </div>
</div>

<script src="js/jalali.js"></script>
<script src="js/storage.js"></script>
<script src="js/history.js"></script>
</body>
</html>
